name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mysql5713:
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      DATABASE_URL: 'mysql://audit:audit@127.0.0.1:3306/fixture?serverVersion=5.7.13&charset=utf8mb4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom
          coverage: none
          tools: composer:v2
      - name: Convert legacy official image format without changing MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          skopeo copy --format v2s2 docker://docker.io/library/mysql:5.7.13 docker-archive:/tmp/mysql5713.tar:mysql5713-ci
          docker load -i /tmp/mysql5713.tar
          docker run -d --name mysql5713 -p 127.0.0.1:3306:3306 -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=audit -e MYSQL_USER=audit -e MYSQL_PASSWORD=audit mysql5713-ci --log-bin-trust-function-creators=1
          for attempt in $(seq 1 60); do
            if docker exec mysql5713 mysqladmin ping -uroot -proot --silent; then break; fi
            sleep 2
          done
          test "$(docker exec mysql5713 mysql -uroot -proot -Nse 'SELECT VERSION()')" = '5.7.13'
          docker exec mysql5713 mysql -uroot -proot -e "CREATE DATABASE fixture; GRANT ALL ON fixture.* TO 'audit'@'%';"
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer test
      - run: composer analyse
      - run: composer install --no-interaction --prefer-dist
        working-directory: fixtures/symfony
      - run: php bin/console doctrine:migrations:migrate --no-interaction
        working-directory: fixtures/symfony
      - run: php mysql_smoke.php
        working-directory: fixtures/symfony
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            symfony: '^7.4'
          - php: '8.4'
            symfony: '^8.0'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: audit
      DATABASE_URL: 'postgresql://audit:audit@127.0.0.1:5432/fixture?serverVersion=17'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_pgsql, mbstring, dom
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --with 'symfony/framework-bundle:${{ matrix.symfony }}'
      - run: composer audit
      - run: composer test
      - run: composer analyse
      - run: psql -h 127.0.0.1 -U audit -d audit -c 'CREATE DATABASE fixture'
      - run: composer install --no-interaction --prefer-dist
        working-directory: fixtures/symfony
      - run: php bin/console doctrine:migrations:migrate --no-interaction
        working-directory: fixtures/symfony
      - run: php smoke.php
        working-directory: fixtures/symfony
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            symfony: '^7.4'
          - php: '8.4'
            symfony: '^8.0'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: audit
          MYSQL_USER: audit
          MYSQL_PASSWORD: audit
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uaudit -paudit"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MYSQL_HOST: 127.0.0.1
      DATABASE_URL: 'mysql://audit:audit@127.0.0.1:3306/audit?serverVersion=8.0.36&charset=utf8mb4'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_mysql, mbstring, dom
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist --with 'symfony/framework-bundle:${{ matrix.symfony }}'
      - run: composer audit
      - name: Allow triggers in disposable MySQL CI service
        run: docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - run: composer test
      - run: composer analyse
      - name: Clear disposable tables for Symfony consumer smoke test
        run: php -r '$db = new PDO("mysql:host=127.0.0.1;dbname=audit", "audit", "audit"); $db->exec("DROP TABLE IF EXISTS app_log, mysql_audit_fixture, mysql_plain_fixture, doctrine_migration_versions");'
      - run: composer install --no-interaction --prefer-dist
        working-directory: fixtures/symfony
      - run: php bin/console doctrine:migrations:migrate --no-interaction
        working-directory: fixtures/symfony
      - run: php mysql_smoke.php
        working-directory: fixtures/symfony
